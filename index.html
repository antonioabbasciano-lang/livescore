<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Live Betting Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; color: #00ff88; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #aaaaaa; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; background-color: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        th, td { padding: 15px; text-align: left; }
        th { background-color: #2a2a2a; color: #00ff88; font-weight: 600; text-transform: uppercase; font-size: 13px; }
        tr { border-bottom: 1px solid #2a2a2a; transition: 0.3s; }
        tr:hover { background-color: #252525; }
        .badge-hot { color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; display: inline-block; min-width: 45px; text-align: center; }
        .badge-time { background-color: #34c759; color: black; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .score { font-family: monospace; font-size: 16px; font-weight: bold; color: #ffcc00; }
        .league-title { font-size: 11px; color: #888; display: block; margin-top: 4px; }
        .status { text-align: center; color: #888; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Live Betting Dashboard</h1>
        <p class="subtitle">🔴 Monitoraggio intensità live in tempo reale (Formula: Gol/Tempo)</p>
        
        <table>
            <thead>
                <tr>
                    <th>Posizione</th>
                    <th>Partita</th>
                    <th>Minuto</th>
                    <th>Risultato</th>
                    <th>Gol Totali</th>
                    <th>Indice Priorità 🔥</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align:center;">Caricamento in corso...</td></tr>
            </tbody>
        </table>
        <div class="status" id="statusMessage">Sistema attivo</div>
    </div>

    <script>
        // Database interno con le principali partite dei campionati europei
        let matchData = [
            { casa: "Inter", ospite: "Juventus", golCasa: 1, golOspite: 1, minuto: 35, lega: "Serie A" },
            { casa: "Milan", ospite: "Napoli", golCasa: 2, golOspite: 0, minuto: 52, lega: "Serie A" },
            { casa: "Roma", ospite: "Lazio", golCasa: 0, golOspite: 1, minuto: 18, lega: "Serie A" },
            { casa: "Manchester City", ospite: "Arsenal", golCasa: 2, golOspite: 2, minuto: 74, lega: "Premier League" },
            { casa: "Real Madrid", ospite: "Barcellona", golCasa: 1, golOspite: 0, minuto: 27, lega: "La Liga" },
            { casa: "Bayern Monaco", ospite: "Dortmund", golCasa: 3, golOspite: 1, minuto: 81, lega: "Bundesliga" }
        ];

        function aggiornaTabella() {
            // Fa scorrere i minuti e simula variazioni di punteggio in tempo reale
            matchData.forEach(m => {
                if (m.minuto < 90) m.minuto += 1;
                if (Math.random() > 0.88 && m.minuto < 90) {
                    if (Math.random() > 0.5) m.golCasa += 1; else m.golOspite += 1;
                }
            });

            let elaborati = matchData.map(m => {
                let golTotali = m.golCasa + m.golOspite;
                let minutoCalcolo = m.minuto > 0 ? m.minuto : 1;
                let indice = parseFloat(((golTotali / minutoCalcolo) * 100).toFixed(2));
                return {
                    partita: `${m.casa} vs ${m.ospite}`,
                    lega: m.lega,
                    minuto: m.minuto,
                    risultato: `${m.golCasa} - ${m.golOspite}`,
                    golTotali: golTotali,
                    indice: indice
                };
            });

            // Ordinamento automatico per indice di priorità decrescente
            elaborati.sort((a, b) => b.indice - a.indice);

            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            elaborati.forEach((m, index) => {
                let coloreIndice = "#444";
                if (m.indice > 10) coloreIndice = "#ff3b30";
                else if (m.indice > 4) coloreIndice = "#ff9500";

                tbody.innerHTML += `<tr>
                    <td><b>${index + 1}°</b></td>
                    <td><b>${m.partita}</b><span class="league-title">${m.lega}</span></td>
                    <td><span class="badge-time">${m.minuto}'</span></td>
                    <td><span class="score">${m.risultato}</span></td>
                    <td>${m.golTotali}</td>
                    <td><span class="badge-hot" style="background-color: ${coloreIndice}">${m.indice}</span></td>
                </tr>`;
            });

            document.getElementById("statusMessage").innerHTML = `✅ Sistema attivo. Ultimo aggiornamento: ore ${new Date().toLocaleTimeString()}`;
        }

        aggiornaTabella();
        setInterval(aggiornaTabella, 5000);
    </script>
</body>
</html>
