<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Live Betting Dashboard - 100% REALE</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; color: #00ff88; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #aaaaaa; margin-bottom: 25px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        button { background-color: #00ff88; color: #121212; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #00cc6e; transform: scale(1.02); }
        .status { text-align: center; color: #888; font-size: 14px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; background-color: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        th, td { padding: 15px; text-align: left; }
        th { background-color: #2a2a2a; color: #00ff88; font-weight: 600; text-transform: uppercase; font-size: 13px; }
        tr { border-bottom: 1px solid #2a2a2a; transition: 0.1s; }
        tr:hover { background-color: #252525; }
        .badge-hot { color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; display: inline-block; min-width: 45px; text-align: center; }
        .badge-time { background-color: #34c759; color: black; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .score { font-family: monospace; font-size: 16px; font-weight: bold; color: #ffcc00; }
        .league-title { font-size: 11px; color: #888; display: block; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Live Betting Dashboard</h1>
        <p class="subtitle">🔴 Match reali globali in tempo reale da ESPN. Ordinati per Intensità (Formula: Gol/Tempo)</p>
        
        <div class="controls">
            <button onclick="caricaDatiESPN()">🔄 Forza Aggiornamento Live</button>
        </div>
        <div class="status" id="statusMessage">Connessione ai server sportivi globali...</div>
        
        <table>
            <thead>
                <tr>
                    <th>Posizione</th>
                    <th>Partita</th>
                    <th>Minuto</th>
                    <th>Risultato Live</th>
                    <th>Gol Totali</th>
                    <th>Indice Priorità 🔥</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align:center; color:#aaa;">In attesa di caricamento online...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function caricaDatiESPN() {
            let status = document.getElementById("statusMessage");
            status.innerHTML = "🔄 Ricezione dei dati in tempo reale da ESPN...";
            
            try {
                // Interroghiamo i server di ESPN usando un proxy di deviazione per saltare qualsiasi tipo di blocco
                let response = await fetch('https://allorigins.win' + encodeURIComponent('https://espn.com'));
                let proxyData = await response.json();
                let data = JSON.parse(proxyData.contents);
                let eventi = data.events || [];
                let listaElaborata = [];
                
                eventi.forEach(e => {
                    try {
                        if (e.competitions && e.competitions.length > 0) {
                            let comp = e.competitions[0];
                            let legaNome = e.status.type.detail || "Match";
                            
                            let casaData = comp.competitors.find(c => c.homeAway === 'home');
                            let ospiteData = comp.competitors.find(c => c.homeAway === 'away');
                            
                            if (casaData && ospiteData) {
                                let squadraCasa = casaData.team.displayName || "Casa";
                                let squadraOspite = ospiteData.team.displayName || "Ospite";
                                
                                let golCasa = parseInt(casaData.score) || 0;
                                let golOspite = parseInt(ospiteData.score) || 0;
                                let golTotali = golCasa + golOspite;
                                
                                let displayTime = e.status.type.shortDetail || "0'";
                                let matchNumeri = displayTime.match(/\d+/);
                                let minutoPulito = matchNumeri ? parseInt(matchNumeri) : 0;
                                
                                // Se la partita è live calcoliamo la priorità reale, escludendo quelle non iniziate (0 gol al 0 minuto)
                                if (displayTime.includes("FT") || displayTime.includes("Fin")) minutoPulito = 90;
                                
                                let minutoCalcolo = minutoPulito > 0 ? minutoPulito : 1;
                                let indice = parseFloat(((golTotali / minutoCalcolo) * 100).toFixed(2));
                                
                                // Mostriamo i match se sono effettivamente in corso o terminati oggi
                                if(minutoPulito > 0 || golTotali > 0) {
                                    listaElaborata.push({
                                        partita: `${squadraCasa} vs ${squadraOspite}`,
                                        lega: legaNome,
                                        minutoText: displayTime,
                                        risultato: `${golCasa} - ${golOspite}`,
                                        golTotali: golTotali,
                                        indice: indice
                                    });
                                }
                            }
                        }
                    } catch (errInner) {}
                });

                listaElaborata.sort((a, b) => b.indice - a.indice);
                
                let tbody = document.getElementById("tableBody");
                tbody.innerHTML = "";
                
                if (listaElaborata.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Nessun match live trovato in questo momento nei database.</td></tr>`;
                } else {
                    listaElaborata.forEach((m, index) => {
                        let coloreIndice = "#444";
                        if (m.indice > 12) coloreIndice = "#ff3b30";
                        else if (m.indice > 5) coloreIndice = "#ff9500";

                        tbody.innerHTML += `<tr>
                            <td><b>${index + 1}°</b></td>
                            <td><b>${m.partita}</b><span class="league-title">${m.lega}</span></td>
                            <td><span class="badge-time">${m.minutoText}</span></td>
                            <td><span class="score">${m.risultato}</span></td>
                            <td>${m.golTotali}</td>
                            <td><span class="badge-hot" style="background-color: ${coloreIndice}">${m.indice}</span></td>
                        </tr>`;
                    });
                }
                
                status.innerHTML = `✅ Dati reali ESPN caricati alle ore ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                status.innerHTML = "⚠️ In attesa di pubblicazione online su GitHub per sbloccare i dati live...";
            }
        }

        caricaDatiESPN();
        setInterval(caricaDatiESPN, 20000);
    </script>
</body>
</html>
